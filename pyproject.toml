[project]
name = "avp-tutor"
version = "0.2.0"
description = "Execution-grounded algorithm tutoring with local Ollama and optional hosted models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0,<1",
    "antlr4-python3-runtime==4.13.2",
    "fastapi>=0.115.0,<1",
    "httpx>=0.28.0,<1",
    "openai>=1.60.0,<2",
    "python-dotenv>=1.1.0,<2",
    "slowapi>=0.1.9,<1",
    "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
semantic = [
    "faiss-cpu>=1.13.1",
    "flagembedding>=1.3.5",
    "numpy>=2.3.5",
    "sentence-transformers>=3.3.0,<4",
    "torch>=2.9.1",
    "transformers>=4.44.0,<5",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.12.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["PseudocodeLexer.py", "PseudocodeParser.py", "PseudocodeListener.py", "PseudocodeVisitor.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
