name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    name: Backend and dataset checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m training.dataset training/seed_examples.jsonl
      - run: uv run python -m training.dataset training/benchmark.jsonl
  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:types
      - run: git diff --exit-code -- ../integrations/schema.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
  container:
    name: Container build and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.full -t avp-tutor:test .
      - name: Verify model-free startup
        run: |
          docker run -d --name avp-tutor-test -p 127.0.0.1:8000:8000 avp-tutor:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              curl --fail --silent http://127.0.0.1:8000/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs avp-tutor-test
          exit 1
